[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devlens-extractors-python"
version = "0.1.0"
description = "DevLens Python extractor — AST-based code analysis producing the DevLens JSON contract"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["devlens_extractors_python*"]